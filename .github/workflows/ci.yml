name: Squiggle packages checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: quantified-uncertainty
  # used by turbo cache hashes, see turbo.json
  PLATFORM: github

jobs:
  build-test-lint:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/install

      - name: Turbo run
        run: npx turbo run build test lint --env-mode=loose

      - name: Bundle and smoke-test Hub workers
        run: |
          npx turbo run bundle --filter=@quri/hub --env-mode=loose
          pnpm --filter @quri/hub exec node --conditions=react-server dist/scripts/process-pending-evaluations.mjs --help
